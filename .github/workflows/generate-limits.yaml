name: Generate Limits

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 18 * * 1-5" # Every Monday at 10:00 PT

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  generate-limits:
    if: github.repository == 'aws/amazon-vpc-cni-k8s'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # refs/tags/v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # refs/tags/v7.0.0
        with:
          go-version-file: '.go-version'

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # refs/tags/v6.3.0
        with:
          role-to-assume: ${{ secrets.OSS_TEST_ROLE_ARN }}
          role-duration-seconds: 900 #
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Run generate-limits
        # Only add or update instance types. Removing a type the API stopped returning is left to a
        # deliberate manual run, since the credentials here may simply not be opted in to the
        # regions where it is offered.
        run: make generate-limits GENERATE_LIMITS_ARGS=-skip-removals

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet pkg/vpc/vpc_ip_resource_limit.go misc/eni-max-pods.txt; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # refs/tags/v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update VPC IP resource limits"
          title: "chore: update VPC IP resource limits"
          body: |
            This PR updates the VPC IP resource limits by running `make generate-limits`.
            
            This is an automated PR created by the weekly generate-limits workflow.
            
            ## Changes
            - Updated VPC IP resource limits based on latest AWS instance types
            - Regenerated `pkg/vpc/vpc_ip_resource_limit.go`
            - Updated `eni-max-pods.txt` file for max pods per instance

            ## Instance types are never removed
            This workflow runs with `-skip-removals`, so it only **adds** new instance types and **updates** the
            limits of existing ones. An instance type that the EC2 API no longer returns keeps the values already
            committed, because it may be absent only since this workflow's credentials are not opted in to the
            regions where it is offered — removing it would break nodes still running on that type.

            Retiring an instance type is therefore a deliberate manual change: edit the generated file, or run
            `make generate-limits` without `GENERATE_LIMITS_ARGS=-skip-removals` using credentials opted in to all
            regions.

            ## Testing
            Please verify that the generated limits are correct.
          branch: automated/update-vpc-limits
          base: master
          delete-branch: true